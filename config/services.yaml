services:
    _defaults:
        autowire: true
        autoconfigure: true

    OHMedia\SecurityBundle\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/OHMediaSecurityBundle.php'

    # alias used in EntityChoicePass
    oh_media_security.entity_choice_manager: '@OHMedia\SecurityBundle\Service\EntityChoiceManager'

    OHMedia\SecurityBundle\Service\UserLifecycle:
        autowire: true
        tags:
            -
                name: 'doctrine.orm.entity_listener'
                event: 'prePersist'
                entity: 'OHMedia\SecurityBundle\Entity\User'
            -
                name: 'doctrine.orm.entity_listener'
                event: 'preUpdate'
                entity: 'OHMedia\SecurityBundle\Entity\User'
            -
                name: 'doctrine.orm.entity_listener'
                event: 'postUpdate'
                entity: 'OHMedia\SecurityBundle\Entity\User'
